# Render Blueprint - Infrastructure as Code (docs/10-DEPLOYMENT.md, D-057).
#
# First production deploy: one long-lived Node web service plus managed
# Postgres. The public read path starts in CONTENT_SOURCE=file so the first
# build does not depend on a freshly empty database. After migrations + ingest
# have run against Render Postgres, flip CONTENT_SOURCE to db in the Render
# dashboard and redeploy.
#
# Background workers and cron jobs remain commented until the editors that
# need scheduled publishing or async work are live.

services:
  - type: web
    name: deepak-labs-web
    runtime: node
    plan: starter
    region: oregon
    branch: main

    # Monorepo: build + start delegate through the root workspace scripts.
    buildCommand: npm ci && npm run build
    startCommand: npm run start

    # The PaaS holds the previous good version if a new boot fails health.
    healthCheckPath: /

    # Owner triggers the first deploy manually. Flip to true only after the
    # first production smoke test passes.
    autoDeploy: false

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # First deploy is file-backed even though Postgres is provisioned below.
      # After `db:migrate` + `db:ingest`, change to `db` and redeploy.
      - key: CONTENT_SOURCE
        value: file
      - key: DATABASE_URL
        fromDatabase: { name: deepak-labs-db, property: connectionString }
      # Render subdomain first; update when the custom domain is live.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://deepak-labs-web.onrender.com
      # Render prompts for these during Blueprint creation. Do not commit real
      # values; paste the bcrypt hash raw/unescaped in the dashboard.
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

    # PR preview environments are the look-dev review surface. They are
    # ephemeral and auto-torn-down.
    previews:
      generation: automatic

databases:
  - name: deepak-labs-db
    plan: basic-256mb
    postgresMajorVersion: "17" # pgvector/pgvector:pg17 in local dev (D-045)
    # Migrations 0000-0004 are run manually after the first service deploy.

